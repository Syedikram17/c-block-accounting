(()=>{'use strict';const $=id=>document.getElementById(id),KEY='cblock_desk_v2',AUTH='cblock_desk_auth';let db={clients:[],expenses:[]},page='dashboard';const today=()=>new Date().toISOString().slice(0,10),fmt=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');db={clients:Array.isArray(x.clients)?x.clients:[],expenses:Array.isArray(x.expenses)?x.expenses:[]}}catch(e){db={clients:[],expenses:[]}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Storage is full. Export a backup.')}}function toast(s){$('toastroot').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('toastroot').innerHTML='',2400)}function enter(){$('login').classList.add('hidden');document.querySelector('.sidebar').classList.remove('hidden');document.querySelector('.main').classList.remove('hidden');render()}function logout(){sessionStorage.removeItem(AUTH);$('login').classList.remove('hidden');document.querySelector('.sidebar').classList.add('hidden');document.querySelector('.main').classList.add('hidden')} $('loginForm').onsubmit=e=>{e.preventDefault();if($('username').value.trim()==='admin'&&$('password').value==='Cblock@123'){sessionStorage.setItem(AUTH,'1');$('loginerr').textContent='';enter()}else $('loginerr').textContent='Incorrect username or password.'};if(sessionStorage.getItem(AUTH)==='1')enter();$('datechip').textContent=new Intl.DateTimeFormat('en-IN',{month:'short',year:'numeric'}).format(new Date());$('menu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelector('.sidebar').classList.remove('open');render()});$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='c-block-backup.json';a.click();URL.revokeObjectURL(u);toast('Backup exported')};
function title(t,sub,btn=''){return `<div class="top"><div><h1>${t}</h1><span class="muted">${sub}</span></div>${btn}</div>`}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({dashboard,clients:clientPage,expenses:expensePage,reports:reportPage,settings:settingsPage}[page]||dashboard)()}
function dashboard(){let total=db.expenses.reduce((a,x)=>a+ +x.amount,0),month=db.expenses.filter(x=>x.date.slice(0,7)===today().slice(0,7)).reduce((a,x)=>a+ +x.amount,0),cats={};db.expenses.forEach(x=>cats[x.category]=(cats[x.category]||0)+ +x.amount);let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let k=d.toISOString().slice(0,7);months.push({l:d.toLocaleDateString('en-IN',{month:'short'}),v:db.expenses.filter(x=>x.date.slice(0,7)===k).reduce((a,x)=>a+ +x.amount,0)})}let max=Math.max(1,...months.map(x=>x.v)),recent=[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),palette=['#e3bb75','#bfc2c9','#8c79bd','#3b9973','#777'];$('content').innerHTML=`<div class="stats"><div class="stat"><div class="stathead">Total Clients <span>♙</span></div><div class="big">${db.clients.length}</div><span class="trend">● Active records</span></div><div class="stat goldstat"><div class="stathead">Total Expenses <span>▱</span></div><div class="big">${fmt(total)}</div><span class="trend">All recorded</span></div><div class="stat"><div class="stathead">This Month Expense <span>↗</span></div><div class="big">${fmt(month)}</div><span class="trend">Current month</span></div></div><div class="layout"><section class="card"><h3>Expenses Overview</h3><div class="chart">${months.map(x=>`<div class="barcol"><div class="bar" title="${fmt(x.v)}" style="height:${Math.max(2,x.v/max*150)}px"></div><small>${x.l}</small></div>`).join('')}</div></section><section class="card"><h3>Expenses by Category</h3>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<div class="category"><i class="dot" style="background:${palette[i%palette.length]}"></i>${esc(k)}<b>${total?Math.round(v/total*100):0}%</b></div>`).join(''):'<div class="empty">Add expenses to see category breakdown.</div>'}<h2 style="text-align:center;margin:20px 0 0">${fmt(total)} <small class="muted" style="font-size:11px">Total</small></h2></section></div><div class="bottomgrid"><section class="card"><div class="top"><h3>Recent Expenses</h3><button class="btn darkbtn" id="viewall">View All →</button></div>${recent.length?`<div class="tablewrap"><table><thead><tr><th>DATE</th><th>CATEGORY</th><th>DESCRIPTION</th><th>AMOUNT</th></tr></thead><tbody>${recent.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.title)}</td><td class="amount">${fmt(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses yet. Add your first expense.</div>'}</section><section class="card"><h3>Quick Actions</h3><div class="quick"><button id="qaClient">♙＋<br><br>Add Client</button><button id="qaExpense">▤＋<br><br>Add Expense</button><button id="qaReport">▥<br><br>View Reports</button><button id="qaExport">⇩<br><br>Export Data</button></div></section></div>`;$('viewall').onclick=()=>{page='expenses';render()};$('qaClient').onclick=openClient;$('qaExpense').onclick=openExpense;$('qaReport').onclick=()=>{page='reports';render()};$('qaExport').onclick=$('export').onclick}
function clientPage(){$('content').innerHTML=title('Clients','Manage your client names and contact details.',`<button class="btn gold" id="add">＋ Add Client</button>`)+`<section class="card"><div class="toolbar"><input id="search" placeholder="Search clients..."><span class="muted">${db.clients.length} clients</span></div><div id="rows"></div></section>`;$('add').onclick=openClient;$('search').oninput=drawClients;drawClients()}function drawClients(){let q=$('search').value.toLowerCase(),a=db.clients.filter(x=>(x.name+x.phone+x.email).toLowerCase().includes(q));$('rows').innerHTML=a.length?`<div class="tablewrap"><table><thead><tr><th>CLIENT</th><th>PHONE</th><th>EMAIL</th><th>ADDED</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.date)}</td><td><button class="btn darkbtn" data-delc="${x.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No clients found. Add your first client.';document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{if(confirm('Delete this client?')){db.clients=db.clients.filter(x=>x.id!==b.dataset.delc);save();drawClients()}})}
function expensePage(){$('content').innerHTML=title('Expenses','Track your business spending.',`<button class="btn gold" id="add">＋ Add Expense</button>`)+`<section class="card"><div class="toolbar"><input id="search" placeholder="Search expenses..."><select id="filter"><option value="all">All dates</option><option value="${today().slice(0,7)}">This month</option></select></div><div id="rows"></div></section>`;$('add').onclick=openExpense;$('search').oninput=drawExpenses;$('filter').onchange=drawExpenses;drawExpenses()}function drawExpenses(){let q=$('search').value.toLowerCase(),m=$('filter').value,a=db.expenses.filter(x=>(x.title+x.category+x.note).toLowerCase().includes(q)&&(m==='all'||x.date.slice(0,7)===m)).sort((x,y)=>y.date.localeCompare(x.date));$('rows').innerHTML=a.length?`<div class="tablewrap"><table><thead><tr><th>DATE</th><th>CATEGORY</th><th>DESCRIPTION</th><th>NOTE</th><th>AMOUNT</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.title)}</td><td>${esc(x.note)}</td><td class="amount">${fmt(x.amount)}</td><td><button class="btn darkbtn" data-dele="${x.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses found.</div>';document.querySelectorAll('[data-dele]').forEach(b=>b.onclick=()=>{if(confirm('Delete this expense?')){db.expenses=db.expenses.filter(x=>x.id!==b.dataset.dele);save();drawExpenses()}})}
function reportPage(){let total=db.expenses.reduce((s,x)=>s+ +x.amount,0),m=db.expenses.filter(x=>x.date.slice(0,7)===today().slice(0,7)).reduce((s,x)=>s+ +x.amount,0),cats={};db.expenses.forEach(x=>cats[x.category]=(cats[x.category]||0)+ +x.amount);$('content').innerHTML=title('Reports','A simple summary of your recorded expenses.')+`<div class="stats"><div class="stat"><div class="stathead">Total Expenses</div><div class="big">${fmt(total)}</div></div><div class="stat"><div class="stathead">This Month</div><div class="big">${fmt(m)}</div></div><div class="stat"><div class="stathead">Expense Entries</div><div class="big">${db.expenses.length}</div></div></div><section class="card"><h3>Category Summary</h3>${Object.entries(cats).length?`<table><thead><tr><th>CATEGORY</th><th>ENTRIES</th><th>TOTAL</th></tr></thead><tbody>${Object.entries(cats).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${db.expenses.filter(x=>x.category===k).length}</td><td class="amount">${fmt(v)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No expense data to report yet.</div>'}</section>`}
function settingsPage(){$('content').innerHTML=title('Settings','Account and workspace settings.')+`<section class="card"><h3>Login details</h3><p class="muted">This demo uses a local front-end login.</p><p>Username: <b>admin</b></p><p>Password: <b>Cblock@123</b></p><button class="btn darkbtn" id="logout">Log out</button></section><section class="card"><h3>Data management</h3><p class="muted">Your records are stored in this browser. Export backups regularly.</p><button class="btn gold" id="backup">Export backup</button></section>`;$('logout').onclick=logout;$('backup').onclick=$('export').onclick}
function modal(title,fields,fn){$('modalroot').innerHTML=`<div class="modalback" id="back"><form class="modal" id="form"><div class="modalhead"><h3>${title}</h3><button type="button" class="btn darkbtn" id="x">×</button></div>${fields}<div class="actions"><button type="button" class="btn darkbtn" id="cancel">Cancel</button><button class="btn gold">Save</button></div></form></div>`;$('x').onclick=$('cancel').onclick=()=>$('modalroot').innerHTML='';$('back').onclick=e=>{if(e.target.id==='back')$('modalroot').innerHTML=''};$('form').onsubmit=e=>{e.preventDefault();fn(new FormData(e.currentTarget))}}
function openClient(){modal('Add Client',`<div class="field"><label>CLIENT NAME *</label><input name="name" required maxlength="100" placeholder="Client / business name"></div><div class="field"><label>PHONE</label><input name="phone" maxlength="40" placeholder="Phone number"></div><div class="field"><label>EMAIL</label><input name="email" type="email" maxlength="120" placeholder="Email address"></div>`,f=>{let name=String(f.get('name')||'').trim();if(!name)return;db.clients.unshift({id:id(),name,phone:String(f.get('phone')||''),email:String(f.get('email')||''),date:today()});save();$('modalroot').innerHTML='';render();toast('Client added')})}
function openExpense(){modal('Add Expense',`<div class="field"><label>DESCRIPTION *</label><input name="title" required maxlength="120" placeholder="e.g. Office rent"></div><div class="field"><label>AMOUNT (₹) *</label><input name="amount" type="number" min=".01" step=".01" required placeholder="0.00"></div><div class="field"><label>CATEGORY</label><select name="category"><option>Office & Rent</option><option>Marketing</option><option>Team & Salary</option><option>Travel</option><option>Software</option><option>Equipment</option><option>Utilities</option><option>Other</option></select></div><div class="field"><label>DATE *</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>NOTE</label><textarea name="note" rows="2" maxlength="250" placeholder="Optional note"></textarea></div>`,f=>{let title=String(f.get('title')||'').trim(),amount=Number(f.get('amount')),date=String(f.get('date')||'');if(!title||!Number.isFinite(amount)||amount<=0||!date){toast('Please check the required fields');return}db.expenses.unshift({id:id(),title,amount,category:String(f.get('category')),date,note:String(f.get('note')||'')});save();$('modalroot').innerHTML='';render();toast('Expense saved')})}
load();if(sessionStorage.getItem(AUTH)==='1')enter();
})();
</script></body></html>
